modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"
logoFile = "icon.png"
logoBlur = false

[[mixins]]
config = "fix_flashback.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Flashback is the mod being patched. Optional so this mod stays inert without it. We must load
# BEFORE it so our mixin config is registered by the time its classes are transformed.
[[dependencies.${mod_id}]]
modId = "flashback"
type = "optional"
versionRange = "*"
ordering = "BEFORE"
side = "BOTH"

# The missing class belongs to Fabric API's networking module, so we must load after its
# Forgified reimplementation.
[[dependencies.${mod_id}]]
modId = "fabric_api"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "connector"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
