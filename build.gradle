plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup("maven.modrinth") }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
    mavenLocal()
}

neoForge {
    version = project.neo_version

    mods {
        fix_flashback {
            sourceSet sourceSets.main
        }
    }

    runs {
        client { client() }
    }
}

// Flashback is only needed at COMPILE time (every hook is a @Pseudo mixin), so we reference the
// jar locally and never ship it. Point FLASHBACK_JAR (or place Flashback-*.jar on the classpath)
// to build. Falls back to a common CurseForge instance layout.
def flashbackJar = System.getenv('FLASHBACK_JAR')
def flashbackDir = System.getenv('FLASHBACK_MODS_DIR')
        ?: "${System.getProperty('user.home')}/Documents/curseforge/minecraft/Instances/Create_Aeronautics_mod_pack_amuonikuzakis_Edition/mods"

dependencies {
    if (flashbackJar) {
        compileOnly files(flashbackJar)
    } else {
        compileOnly fileTree(dir: flashbackDir, includes: ['Flashback-*.jar'])
    }
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:-options'
}

processResources {
    def expandProps = [
            'mod_id'             : project.mod_id,
            'mod_name'           : project.mod_name,
            'mod_license'        : project.mod_license,
            'mod_version'        : project.mod_version,
            'mod_authors'        : project.mod_authors,
            'mod_description'    : project.mod_description,
            'neo_version_range'  : project.neo_version_range,
            'loader_version_range': project.loader_version_range,
            'minecraft_version'  : project.minecraft_version
    ]

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : project.mod_authors,
                'MixinConfigs'          : 'fix_flashback.mixins.json'
        ])
    }
}
